name: Bug report
description: Report a reproducible compiler defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: shader
    attributes:
      label: Minimal shader
      render: python
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Compiler diagnostics and environment

