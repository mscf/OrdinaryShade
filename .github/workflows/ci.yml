name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  wgsl-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Naga validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: ${{ runner.os }}-${{ runner.arch }}-naga-cli-30.0.0-v2
      - name: Ensure Naga validator is executable
        run: |
          if ! command -v naga >/dev/null 2>&1; then
            cargo install naga-cli --version 30.0.0 --locked
          fi
          naga --version
      - run: python -m pip install -e .
      - run: python scripts/validate_generated_wgsl.py
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ordinaryshade-distributions
          path: dist/

  ordinarylight-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Ordinary Light
        uses: actions/checkout@v4
        with:
          repository: mscf/OrdinaryLight
          path: compatibility/OrdinaryLight
      - name: Expose this checkout as Ordinary Light's sibling compiler
        run: ln -s "$GITHUB_WORKSPACE" compatibility/ordinaryshade
      - name: Install Vulkan shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Install Ordinary Light with its Vulkan bindings
        run: python -m pip install -e "compatibility/OrdinaryLight[vulkan]"
      - name: Verify Ordinary Light generated sources
        working-directory: compatibility/OrdinaryLight
        run: |
          python scripts/generate_color_shaders.py --check
          python scripts/generate_effect_shaders.py --check
          python scripts/generate_primary_shaders.py --check
          python scripts/generate_core_shaders.py --check
      - name: Run Ordinary Light compiler compatibility tests
        working-directory: compatibility/OrdinaryLight
        run: python -m unittest tests.test_ordinaryshade_color tests.test_ordinaryshade_effects tests.test_ordinaryshade_primary tests.test_ordinaryshade_core tests.test_materials tests.test_shader_manifest
